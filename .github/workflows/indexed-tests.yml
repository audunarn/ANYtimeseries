name: indexed rainflow tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  indexed:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install headless numerical dependencies
        run: python -m pip install numpy scipy matplotlib pytest "setuptools>=61" wheel
      - name: Test indexed core and frozen legacy fixtures
        run: python -m pytest -q tests/test_indexed_rainflow.py
      - name: Test existing fatigue helper
        if: matrix.python != '3.8'
        run: python -m pytest -q tests/test_fatigue_tool.py
      - name: Build and smoke-test installed wheel outside checkout
        shell: bash
        run: |
          python -m pip wheel . --no-deps --no-build-isolation -w dist
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from anyqats.fatigue.rainflow import count_cycles_indexed; r=count_cycles_indexed([0,4,2,3,1,5,0],True); assert len(r)==4 and r[0].closing_index==4; print(r[0])"
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - name: Install application and test dependencies
        # Existing SWAN GUI module imports Plotly; it is not declared in the base package.
        run: python -m pip install -e . pytest build plotly
      - name: Complete application regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs
