name: indexed rainflow implementation integration
on:
  push:
    branches: [feat/indexed-rainflow]
    paths: [.github/workflows/indexed-snapshot.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/indexed-rainflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical test tools
        run: python -m pip install numpy scipy matplotlib pytest setuptools wheel
      - name: Freeze original owner reference before applying changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util, json, numpy as np
          ts = Path('.')
          spec = importlib.util.spec_from_file_location('legacy', ts/'anyqats/fatigue/rainflow.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          cases=[]
          inputs=[[0,-2,1,-3,5,-1,3,-4,4,-2,0],[0,3,1,2,-1],[3,0,2,1,3],[1,1,1],[0,1,1,0,0,2,2,-1,-1]]
          rng=np.random.default_rng(872140)
          inputs += [rng.integers(-10,11,size=n).tolist() for n in (2,3,4,5,8,12,20,30,40,64)]
          inputs += [rng.normal(size=n).tolist() for n in (4,8,16,32)]
          for x in inputs:
              for endpoint in (False,True):
                  try: table=mod.count_cycles(x,endpoints=endpoint).tolist()
                  except ValueError: table=[]
                  cases.append(dict(samples=x,endpoints=endpoint,table=table))
          (ts/'tests/data').mkdir(exist_ok=True)
          (ts/'tests/data/indexed_legacy_reference.json').write_text(json.dumps({'source_commit':'7eea1ca053c7d2b77e23d9c85d2ca56a63cae6bf','source_blob':'5273f04ee87548f151a3f8145790b336ba1ad8a4','cases':cases},indent=2)+'\n')
          PY
      - name: Apply integration patch and verify
        run: |
          git apply --check --index .github/indexed-owner.patch
          git apply --index .github/indexed-owner.patch
          git add tests/data/indexed_legacy_reference.json
          python -m pytest -q tests/test_indexed_rainflow.py tests/test_fatigue_tool.py --junitxml="$RUNNER_TEMP/indexed-tests.xml"
      - name: Verify exact tested tree and commit development branch
        run: |
          git rm .github/indexed-owner.patch .github/workflows/indexed-snapshot.yml
          git diff --cached --check
          test "$(git write-tree)" = '42f07e472544524337978b4c64467d7650e3d96d'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate indexed rainflow after reference, regression and exact-tree checks'
          git push origin HEAD:refs/heads/feat/indexed-rainflow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexed-integration-evidence
          path: ${{ runner.temp }}/indexed-tests.xml
          retention-days: 3
